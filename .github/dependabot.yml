version: 2
updates:
  # Maintain Python dependencies via uv
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Maintain GitHub Actions configurations
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
